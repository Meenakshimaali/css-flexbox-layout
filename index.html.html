<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment</title>
    <style>
        .con{
            height: 600px;
            width: 100%;
            border: 1px solid black;
        }
        .header,.footer{
            height: 20%;
            width: 100%;
            border: 1px solid black;
            background-color: rgb(187, 190, 240);
            text-align: center;
            align-content: center;
            color: white;
        }
        .middle{
            height: 60%;
            width: 100%;
            border: 1px solid black;
            display: flex;
            color: white;
        }
        .left{
            height: 100%;
            width: 20%;
            border: 1px solid black;
            background-color:rgb(94, 166, 234);
            text-align: center;
            align-content: center;
            color: white;
        }.right{
            height: 100%;
            width: 80%;
            border: 1px solid black;
            color: white;
        }
        .top{
            height: 50%;
            width: 100%;
            border: 1px solid black;
            background-color:rgb(63, 109, 195);
            text-align: center;
            align-content: center;
            color: white;
        }
        .bottom{
            height: 50%;
            width: 100%;
            border: 1px solid black;
            display : flex;
            color:white;
        }
        .bottom1,.bottom2{
            height: 100%;
            width: 50%;
            border: 1px solid black;
            background-color: rgb(95, 79, 196);
            text-align: center;
            align-content: center;
            color:white;
        }
        
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        h1{
            text-align: center;
            
        }
    </style>
</head>
<body>
    <h1>Flex Box</h1>
    <div class="con">
        <div class="header">
            Header
        </div>
        <div class="middle">
            <div class="left">Middle Left</div>
            <div class="right">
                <div class="top">
                    Right Top
                </div>
                <div class="bottom">
                    <div class="bottom1">
                        Bottom Left
                    </div>
                    <div class="bottom2">
                        Bottom Right
                    </div>
                </div>
            </div>
        </div>
        <div class="footer">
            Footer
        </div>
    </div>
</body>
</html>
